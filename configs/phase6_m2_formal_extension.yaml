protocol_id: phase6_m2_formal_extension_design_v1_0
version: 1.0.0-design-candidate
status: candidate_for_formal_extension_review
runner_namespace: phase6_m2_formal_extension_v1_0
output_root: outputs/phase6_m2_formal_extension_v1_0
initial_draft_on: 2026-08-14
revised_on: 2026-08-14

parent_evidence:
  confirmation_results_pr: 51
  confirmation_audit: docs/handoffs/2026-08-14_phase6_m2c2_confirmation_grid_audit.json
  confirmation_audit_sha256: 92f326e30b5f36b10025261382dc37335c7a00b00ee0b409aecac6573b5a24e2
  required_parent_decision: permit_separate_formal_extension_design_PR_only
  passing_betas: [1.1]
  parent_claim_scope: single_beta_only_budget_effect_claims_forbidden
  parent_formal_extension_authorized: false

scope_extension_under_current_review:
  parent_directly_supports_primary_beta: 1.1
  requested_secondary_boundary_beta: 1.3
  inherited_parent_authorization_for_secondary_beta: false
  secondary_beta_requires_explicit_approval_in_this_design_PR: true
  secondary_purpose: within_beta_T03_minus_C0_disruption_amplification_only
  cross_beta_budget_effect_estimation_forbidden: true

scientific_model:
  base_model: M2_supply_disruption
  tier_id: M2F2
  item_count: 2
  periods: 6
  training_scenario_count: 100
  shared_emergency_reserve_pool: true
  first_stage_budget_equality_unchanged: true
  relative_complete_recourse_unchanged: true
  emergency_price_and_shortage_penalty: frozen_M2_baseline
  item_archetype_source: first_two_frozen_phase6_item_archetypes
  item_ids: [relief_food_1, relief_food_2]
  supply_vulnerability_multipliers: [0.8, 1.2]
  reference_budget: 2337.610924158743
  storage_capacity: [288.75, 294.841333698683, 294.841333698683, 288.75, 203.908666301317, 203.90866630131694]
  runner_must_recompute_budget_and_capacity_before_scenario_generation: true

profiles:
  C0:
    enabled: false
    loss_scale: 0.0
    recovery_fraction: 0.0
    role: no_disruption_control
  C1:
    enabled: true
    loss_scale: 0.2
    recovery_fraction: 0.0
    role: light_disruption_control
  T03:
    enabled: true
    loss_scale: 0.3
    recovery_fraction: 0.0
    role: threshold_neighborhood_treatment

seed_protocol:
  pilot_seeds: [2026081601, 2026081602, 2026081603]
  pilot_test_seeds: [2026081701]
  formal_training_seeds: [2026081401, 2026081402, 2026081403, 2026081404, 2026081405, 2026081406, 2026081407, 2026081408, 2026081409, 2026081410]
  formal_test_seeds: [2026081501, 2026081502, 2026081503, 2026081504, 2026081505, 2026081506, 2026081507, 2026081508, 2026081509, 2026081510]
  formal_training_test_pairing: same_list_position_one_to_one
  all_four_sets_pairwise_disjoint: true
  disjoint_from_all_M0_M1_M2_development_confirmation_pilot_formal_and_test_seeds: true
  formal_seeds_must_not_be_used_for_configuration_selection: true

mechanism_experiment:
  primary_track:
    beta: 1.1
    budget: 2571.372016574617
    profiles: [C0, C1, T03]
    formal_run_count: 30
    role: primary_two_item_endogenous_reserve_validation
  secondary_track:
    beta: 1.3
    budget: 3038.894201406366
    profiles: [C0, T03]
    formal_run_count: 20
    role: baseline_activation_and_disruption_amplification_boundary
    primary_estimand: paired_T03_minus_C0_robust_autonomous_reserve_ratio
    budget_effect_claims_forbidden: true
  total_formal_run_count: 50
  strictly_serial: true
  run_all_cases_without_adaptive_stopping: true
  configuration_changes_after_observing_results_forbidden: true
  common_random_numbers_within_training_seed_across_all_betas_and_profiles:
    required_equal_components: [latent_draw, demand, emergency_price, emergency_supply, scenario_order]
    fulfillment_component_expected_to_differ_by_profile: true
    new_random_draws_for_disruption: 0

reserve_identification:
  tolerance_optimal_interval: complete_finite_scenario_extensive_model
  restricted_CCG_master_for_interval_forbidden: true
  robust_autonomous_reserve_formula: max_zero_R_min_opt_minus_R_min_feas
  numerical_activation_ratio_strictly_greater_than: 1.0e-4
  substantive_activation_ratio_greater_than_or_equal_to: 0.01
  moderate_autonomous_reserve_ratio_interval: [0.05, 0.50]
  moderate_interval_endpoints_inclusive: true
  cross_item_plan_source: complete_extensive_model_R_min_opt_endpoint

pilot_protocol:
  runner_must_be_approved_in_separate_PR: true
  mechanism_cases_per_seed:
    - {beta: 1.1, profiles: [C0, C1, T03]}
    - {beta: 1.3, profiles: [C0, T03]}
  mechanism_run_count: 15
  out_of_sample_throughput_probe:
    pilot_training_seed: 2026081601
    pilot_test_seed: 2026081701
    training_and_test_seeds_must_differ: true
    pilot_test_seed_must_be_disjoint_from_all_pilot_training_and_formal_seeds: true
    beta: 1.1
    profile: T03
    strategy_count: 5
    test_scenario_count: 2000
  checks_only:
    - all_solves_optimal
    - common_random_numbers_verified
    - tolerance_optimal_reserve_intervals_closed
    - all_out_of_sample_recourse_optimal
    - runtime_and_memory_projection_within_frozen_limits
    - result_fields_and_hashes_complete
  reserve_activation_may_not_change_formal_design: true
  pilot_completion_does_not_authorize_formal_execution: true

out_of_sample_strategy_experiment:
  core_configuration: {beta: 1.1, profile: T03}
  training_seed_count: 10
  paired_test_seed_count: 10
  test_scenarios_per_pair: 2000
  strategies:
    - endogenous_reserve
    - zero_autonomous_reserve
    - fixed_autonomous_reserve_0_10
    - fixed_autonomous_reserve_0_30
    - fixed_autonomous_reserve_0_50
  plan_count: 50
  exact_recourse_evaluation_count: 100000
  every_strategy_reoptimizes_regular_procurement: true
  reuse_other_strategy_first_stage_plan_forbidden: true
  test_scenario_reoptimization_forbidden: true
  common_test_scenarios_across_strategies_within_training_test_pair: true
  metrics:
    - mean_total_cost
    - p95_total_cost
    - cvar95_total_cost
    - demand_weighted_service_level
    - shortage_probability
    - emergency_procurement_spend
    - cross_item_emergency_fund_allocation
  comparisons:
    - endogenous_minus_zero_autonomous_reserve
    - endogenous_minus_best_fixed_autonomous_reserve_ratio
  best_fixed_ratio_selection:
    candidate_rhos: [0.1, 0.3, 0.5]
    selection_data: training_scenarios_only
    criterion: minimum_exact_training_robust_objective
    deterministic_tie_break: smallest_rho
    test_scenarios_or_test_metrics_for_selection_forbidden: true
  first_stage_plan_identity:
    endogenous_reserve:
      source: complete_extensive_model_R_min_opt_endpoint
      arbitrary_initial_R_star_plan_forbidden: true
    zero_autonomous_reserve:
      reserve_formula: R_min_feas
    fixed_autonomous_reserve:
      reserve_formula: R_min_feas_plus_rho_times_budget_minus_R_min_feas
      rho: [0.1, 0.3, 0.5]
    every_strategy_fixed_reserve_then_reoptimizes_regular_procurement: true
    required_plan_identity_fields:
      - reserve_amount
      - regular_purchase_sha256
      - exact_training_objective
      - training_joint_scenario_set_sha256
      - finalized_plan_artifact_sha256
    OOS_worker_reads_finalized_plan_artifact_only: true
    OOS_worker_reoptimization_or_plan_substitution_forbidden: true

statistical_protocol:
  independent_unit: formal_training_seed
  technical_repetitions_are_not_independent_samples: true
  scenario_budget_profile_and_strategy_rows_are_not_independent_samples: true
  pairing:
    mechanism: same_training_seed
    out_of_sample: same_training_seed_and_paired_test_seed
  bootstrap:
    method: paired_cluster_percentile
    cluster_unit: formal_training_seed
    random_seed: 2026081499
    resamples: 10000
    confidence_level: 0.95
    point_estimator: arithmetic_mean_of_ten_seed_level_paired_differences
    paired_difference_direction: strategy_or_treatment_A_minus_comparator_B
    resampling_algorithm: sample_ten_training_seed_pairs_with_replacement_then_recompute_arithmetic_mean
    median_effect_role: descriptive_supplement_only
  wilcoxon:
    test: paired_two_sided_signed_rank
    unit: one_paired_summary_per_formal_training_seed
    zero_method: pratt
    method: approx
    correction: false
    all_zero_differences_rule: statistic_zero_p_value_one
  primary_mechanism_estimands:
    - beta_1_1_T03_minus_C0_robust_autonomous_reserve_ratio
    - beta_1_1_T03_minus_C1_robust_autonomous_reserve_ratio
  secondary_mechanism_estimands:
    - beta_1_3_T03_minus_C0_robust_autonomous_reserve_ratio
    - beta_1_1_T03_cross_item_allocation_share_range
  out_of_sample_primary_estimands:
    - endogenous_minus_zero_mean_total_cost
    - endogenous_minus_zero_cvar95_total_cost
    - endogenous_minus_zero_demand_weighted_service_level
    - endogenous_minus_best_fixed_mean_total_cost
    - endogenous_minus_best_fixed_cvar95_total_cost
  p_values_role: supportive_not_sole_evidence
  effect_sizes_and_confidence_intervals_required: true
  no_strong_budget_effect_claim: true
  multiple_testing:
    familywise_alpha: 0.05
    mechanism_primary_family: holm_two_tests
    out_of_sample_primary_family: holm_five_tests
    secondary_estimands: descriptive_unadjusted_and_explicitly_labeled

compute_gate:
  projection_uses_completed_pilot_wall_time_and_sampled_peak_RSS: true
  mechanism_formal_projected_wall_hours_maximum: 72.0
  out_of_sample_formal_projected_wall_hours_maximum: 72.0
  combined_extension_projected_wall_hours_maximum: 168.0
  per_solver_call_seconds: 120
  mechanism_case_wall_seconds: 900
  OOS_plan_wall_seconds: 7200
  failed_timeout_invalid_or_missing_pilot_units_allowed: 0
  compute_gate_passed_initial: false
  formal_extension_authorized_initial: false

metric_definitions:
  total_cost: regular_procurement_cost_plus_exact_scenario_recourse_cost
  reserve_is_funding_capacity_not_an_extra_realized_cost: true
  service_level: total_demand_weighted
  shortage_positive_tolerance: 1.0e-7
  p95_quantile_method: linear
  cvar95: worst_five_percent_with_boundary_weighting
  cross_item_interpretation: observed_for_selected_R_min_opt_endpoint_plan_not_all_optimal_recourse_solutions

algorithm_performance_followup:
  executed_in_this_protocol: false
  minimum_scope_after_mechanism_and_OOS_review:
    correctness: extensive_standard_CCG_SPW_CCG_objective_consistency
    medium_scale: standard_CCG_vs_SPW_CCG_cold_warm_comparison
    stress_scale: runtime_iterations_scenario_pool_and_sampled_peak_RSS
    required_profiles: [C0, T03]
    primary_beta: 1.1
  separate_design_and_authorization_required: true

execution_sequence_and_stop_boundaries:
  sequence:
    - formal_runner_implementation_PR
    - technical_pilot_15_mechanism_runs_and_one_OOS_probe
    - pilot_results_PR_and_compute_gate_review
    - formal_mechanism_50_runs
    - mechanism_results_PR_review
    - formal_OOS_100000_exact_recourse_evaluations
    - OOS_results_PR_review
    - separate_algorithm_performance_design_and_execution
    - final_paper_synthesis
  no_stage_may_start_before_previous_results_PR_is_reviewed_and_merged: true

reproducibility_and_safety:
