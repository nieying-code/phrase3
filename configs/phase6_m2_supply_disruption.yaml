protocol_id: phase6_m2_supply_disruption_v1_0
version: 1.0.0-design
status: candidate_design_pending_review
initial_draft_on: 2026-08-12
revised_on: 2026-08-12

base_model:
  id: M0
  matrix_path: configs/phase6_experiment_matrix.yaml
  preserve_existing_results: true
runner_namespace: phase6_m2_supply_disruption
output_root: outputs/phase6_m2_supply_disruption_v1
inherit_m0_or_m1_authorization: false
accept_m0_or_m1_registry_or_projection: false

regular_supply_disruption:
  enabled: false
  profile: C0
  c0_forces_alpha_exactly_one: true
  infinity_or_mean_one_proxy_forbidden: true

joint_scenario_protocol:
  demand_and_fulfillment_share_frozen_demand_latent: true
  higher_latent_increases_demand_and_reduces_fulfillment: true
  common_random_numbers_across_profiles: true
  additional_random_draws_for_fulfillment: 0
  fulfillment_formula: clip_one_minus_loss_scale_times_normal_cdf_demand_latent_times_linear_recovery
  truncation: clip_to_closed_unit_interval

disruption_profiles:
  C0: {enabled: false, loss_scale: 0.0, recovery_fraction: 0.0}
  C1: {enabled: true, loss_scale: 0.2, recovery_fraction: 0.0}
  C2: {enabled: true, loss_scale: 0.6, recovery_fraction: 0.0}

unchanged_scientific_rules:
  first_stage_budget: regular_contract_cost_plus_reserve_equals_budget
  initial_inventory_affected_by_disruption: false
  emergency_purchase_observes_full_scenario: true
  emergency_purchase_spend_bounded_by_reserve: true
  emergency_price: inherit_frozen_M0_baseline
  shortage_penalty: inherit_frozen_M0_baseline
  regular_contract_refund: false
  undelivered_contract_additional_cost: false
  undelivered_contract_enters_inventory_or_disposal: false
  procurement_cap_lead_time_supplier_choice_or_multistage_extension: forbidden

reserve_identification:
  minimum_feasible_reserve: 0.0_without_procurement_cap
  tolerance_optimal_interval: complete_finite_scenario_extensive_model
  restricted_CCG_master_for_interval_forbidden: true
  numerical_activation_ratio_strictly_greater_than: 1.0e-4
  substantive_activation_ratio_greater_than_or_equal_to: 0.01

development_preregistration:
  execution_allowed_in_this_revision: false
  tier: V1
  seeds: [2026081101, 2026081102, 2026081103]
  beta: [0.9, 1.1, 1.3]
  profiles: [C0, C1, C2]
  configuration_count: 27
  success_rule:
    all_three_seeds_optimal: true
    minimum_substantive_activation_seed_count: 2
    cost_service_or_manual_trend_selection_forbidden: true
  stop_rule:
    if_no_profile_budget_combination_passes: stop_without_parameter_chasing
  multi_item_confirmation:
    allowed_only_after_V1_activation: true
    status: not_designed_or_authorized

reporting:
  fulfillment_statistics:
    - arithmetic_mean
    - demand_weighted_mean
    - minimum
    - p05
    - full_interruption_rate
    - severe_interruption_rate_below_0_5
    - period_means
    - total_demand_weighted_fulfillment_correlation
  undelivered_contract_is_reporting_only: true

audit_protocol:
  namespace: phase6_m2_supply_disruption_v1
  compact_machine_audit_required: true
  M0_or_M1_artifact_migration_forbidden: true
  raw_large_results_committed_to_git: false

execution_boundaries:
  development_matrix_started: false
  pilot_started: false
  formal_started: false
  M0_E3_started_by_this_protocol: false
