  test_seed_selector: paired_first_5_formal_test_seeds
  budget_factors:
    - 0.90
    - 1.10
    - 1.30
  policies:
    - deterministic_mean
    - zero_reserve
    - fixed_reserve_0_10
    - fixed_reserve_0_30
    - fixed_reserve_0_50
    - endogenous_reserve
  scenarios_per_training_seed: 2000
  independent_from_training: true
  common_test_set_across_policies: true
  reoptimization_on_test_set_forbidden: true
  status_accounting:
    total_scenario_count_required: true
    optimal_scenario_count_required: true
    infeasible_scenario_count_required: true
    solver_failure_count_required: true
    solver_failures_are_not_infeasibility: true
    mutually_exclusive_terminal_categories:
      - optimal
      - infeasible
      - solver_failure
    count_identity: total_scenario_count_equals_optimal_scenario_count_plus_infeasible_scenario_count_plus_solver_failure_count
    count_identity_must_hold_before_reporting: true
    recourse_feasibility_rate:
      formula_when_solver_failure_count_is_zero: optimal_scenario_count_divided_by_total_scenario_count
      value_when_solver_failure_count_is_positive: null
    optimal_evaluation_rate:
      formula: optimal_scenario_count_divided_by_total_scenario_count
    plan_oos_status:
      complete_feasible: all_scenarios_optimal
      contains_infeasible_recourse: infeasible_count_positive_and_solver_failure_count_zero
      incomplete_solver_failure: solver_failure_count_positive_and_infeasible_count_zero
      incomplete_solver_failure_and_infeasible: solver_failure_count_positive_and_infeasible_count_positive
  aggregate_metric_rule:
    required_status: complete_feasible
    on_any_infeasible_or_solver_failure: set_all_cost_shortage_service_waste_and_spend_aggregates_to_null
    conditional_success_only_aggregates_forbidden: true
    arbitrary_big_m_cost_forbidden: true
    noncomplete_plans_retained_in_feasibility_and_failure_tables: true
  metric_definitions:
    total_cost: regular_purchase_cost_plus_exact_scenario_recourse_cost
    reserve_is_not_added_to_total_cost: true
    shortage_tolerance: 1.0e-7
    shortage_probability: fraction_of_scenarios_with_total_shortage_above_tolerance
    scenario_service_level: one_minus_total_shortage_divided_by_total_demand
    zero_total_demand_service_level: 1.0
    reported_service_level:
      aggregation: demand_weighted_across_all_scenarios
      formula: one_minus_sum_shortage_over_all_scenarios_divided_by_sum_demand_over_all_scenarios
      zero_total_demand_value: 1.0
      arithmetic_mean_of_scenario_service_levels_is_not_primary: true
    empirical_quantile_method: linear_type_7
    empirical_cvar95: average_worst_five_percent_with_fractional_boundary_weight
    expired_waste: inventory_exiting_at_the_maximum_age
    early_disposal: nonexpired_inventory_exiting_before_the_maximum_age
    total_disposal: expired_waste_plus_early_disposal
    waste_legacy_alias: total_disposal
    reserve_utilization:
      formula_when_reserve_above_tolerance: scenario_emergency_spend_divided_by_reserve_then_mean
      reserve_tolerance: 1.0e-9
      value_when_reserve_at_or_below_tolerance: null
      zero_reserve_flag_required: true
  metrics:
