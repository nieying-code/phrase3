timeout_protocol:
  solver_call_limit:
    enforcement: pass_to_each_solver_invocation
    time_limit_is_not_infeasibility: true
  ccg_budget_wall_limit:
    enforcement: external_runner_watchdog
    includes:
      - initialization
      - all_master_solves
      - all_oracle_recourse_solves
      - result_extraction
  budget_sequence_wall_limit:
    enforcement: external_runner_watchdog
    applies_separately_to:
      - standard_ccg_cold_budget_sequence
      - spw_ccg_warm_budget_sequence
    includes_all_planned_budget_initialization_and_solves: true
  paired_sequence_failure_rule:
    stop_pair_sequence_when_either_algorithm_is_nonoptimal: true
    remaining_budget_status: not_run_after_pair_sequence_failure
    transfer_partial_warm_pool: false
    only_optimal_budget_state_may_transfer: true
  partial_result_retention:
    preserve_completed_budget_pairs: true
    preserve_current_partial_iteration_log: true
    preserve_current_scenario_pool_and_bounds: true
    preserve_timeout_scope_and_elapsed_time: true
    command_line_exit_nonzero: true
    automatic_retry_in_primary_results: false

