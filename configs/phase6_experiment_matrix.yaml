    seed_with_no_jointly_completed_budget:
      primary_effect_value: null
      retained_in_completion_rate_denominator: true
  tier_reporting_roles:
    V1: correctness_only
    V2: primary_inferential
    P1: limited_inferential
    P2: descriptive_only
    significance_tests_for_correctness_and_descriptive_tiers_forbidden: true
  paired_completion_reporting:
    required:
      - cold_completion_rate
      - warm_completion_rate
      - joint_pair_completion_rate
      - conditional_speedup_on_jointly_completed_pairs
    denominator: all_planned_budget_runs_or_pairs_including_timeout_failure_and_skipped_after_sequence_failure
    formulas:
      cold_completion_rate: optimal_cold_runs_divided_by_planned_cold_runs
      warm_completion_rate: optimal_warm_runs_divided_by_planned_warm_runs
      joint_pair_completion_rate: jointly_optimal_pairs_divided_by_planned_pairs
    conditional_speedup_must_not_be_reported_without_all_three_completion_rates: true
  descriptive_statistics:
    - count
    - mean
    - standard_deviation
    - median
    - interquartile_range
    - minimum
    - maximum
  uncertainty:
    method: paired_bootstrap
    confidence_level: 0.95
    bootstrap_resamples: 10000
    confidence_interval_method: percentile
    random_engine: numpy_Generator_PCG64DXSM
    bootstrap_random_seeds:
      fixed_budget: 2026090601
      budget_sequence_cluster: 2026090602
  optional_nonparametric_test:
    name: wilcoxon_signed_rank
    fixed_budget_input: one_paired_technical_median_per_training_seed
    budget_sequence_input: one_within_seed_median_log_speedup_per_training_seed
    seed_budget_rows_must_not_be_treated_as_independent: true
  multiple_comparison_rule: report_effect_sizes_and_adjusted_p_values_when_used
  runtime_primary_statistic: median

scale_advancement:
  all_conditions:
    joint_pair_completion_rate_minimum: 0.80
    max_algorithm_median_runtime_fraction_maximum: 0.75
  joint_pair_completion_rate:
    numerator: cold_and_warm_both_optimal_pair_count
    denominator: all_planned_pairs_including_timeout_failure_and_not_run_after_sequence_failure
  runtime_fraction:
    eligible_pairs: jointly_optimal_pairs_only
    runtime_input_after_technical_repetitions: median_wall_time_for_each_algorithm_tier_seed_budget
    denominator: tier_ccg_budget_wall_seconds_for_one_algorithm
    cold_statistic: median_cold_runtime_divided_by_budget_wall_over_eligible_pairs
    warm_statistic: median_warm_runtime_divided_by_budget_wall_over_eligible_pairs
    gate_statistic: maximum_of_cold_statistic_and_warm_statistic
    timeout_failure_and_not_run_handling: excluded_from_runtime_medians_but_retained_in_joint_completion_denominator
    no_jointly_optimal_pairs: gate_fails
  stop_rule: report_largest_verified_tier_before_algorithmic_expansion
  failures_must_remain_in_denominators: true

reproducibility:
  save_resolved_config: true
  save_training_scenarios: true
  save_test_scenarios: true
  save_content_hashes: true
  save_git_commit: true
  save_python_and_package_versions: true
  save_solver_and_version: true
  save_hardware_and_thread_count: true
  save_run_start_and_end_time: true
  save_failure_diagnostics: true
  raw_data_is_immutable: true

required_outputs:
  - outputs/experiments/phase6/run_registry.csv
  - outputs/experiments/phase6/model_comparison.csv
  - outputs/experiments/phase6/algorithm_performance.csv
  - outputs/experiments/phase6/out_of_sample_evaluation.csv
  - outputs/experiments/phase6/out_of_sample_feasibility.csv
  - outputs/experiments/phase6/sensitivity_results.csv
  - outputs/experiments/phase6/failure_registry.csv
  - outputs/experiments/phase6/pilot_throughput_projection.json
  - outputs/experiments/phase6/scale_advancement.json
  - outputs/experiments/phase6/real_data_calibration_protocol.json
  - outputs/experiments/phase6/manifests
  - outputs/figures/phase6
