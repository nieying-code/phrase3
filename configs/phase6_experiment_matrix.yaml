data_tracks:
  controlled_synthetic:
    role: correctness_scalability_and_mechanism_identification
    generator_family: correlated_finite_scenarios
    required: true
  real_calibrated_synthetic:
    role: external_calibration_with_independent_resampling
    required_for_core_method_claims: false
    optional_for_external_validity_extension: true
    status: awaiting_separate_calibration_protocol
    included_in_v2_1_compute_total: false
    execution_gate: provenance_and_calibration_report_approved
  historical_case:
    role: interpretable_case_study
    required: false
    execution_gate: demand_price_and_supply_proxies_are_traceable

controlled_synthetic_baseline:
  legacy_D0_uses_phase3_parameters_unchanged: true
  common_disaster_factor_across_items: true
  item_specific_noise: true
  period_specific_noise: true
  demand_cv: 0.30
  emergency_price_markup_mean: 0.35
  emergency_price_markup_sd: 0.15
  supply_reduction_mean: 0.20
  supply_shock_sd: 0.20
  demand_price_correlation: 0.60
  demand_supply_correlation: -0.45
  shortage_penalty_multiplier: 12.0
  waste_penalty_multiplier: 0.25
  seasonality_rule: deterministic_periodic_profile_normalized_to_mean_one
  item_archetypes:
    - id: relief_food_1
      demand_multiplier: 1.00
      regular_price_multiplier: 1.00
      shelf_life_periods: 6
    - id: relief_food_2
      demand_multiplier: 0.75
      regular_price_multiplier: 1.20
      shelf_life_periods: 4
    - id: relief_food_3
      demand_multiplier: 0.50
      regular_price_multiplier: 1.50
      shelf_life_periods: 3
    - id: relief_food_4
      demand_multiplier: 0.35
      regular_price_multiplier: 2.00
      shelf_life_periods: 2
    - id: relief_food_5
      demand_multiplier: 0.25
      regular_price_multiplier: 2.50
      shelf_life_periods: 1
  tier_item_rule: use_first_k_archetypes

inventory_exit_protocol:
  protocol_id: penalized_relative_complete_recourse_v1
  nonexpired_inventory_exit: early_disposal
  maximum_age_inventory_exit: expired_waste
  total_disposal_formula: expired_waste_plus_sum_early_disposal_over_nonmaximum_ages
  early_disposal_unit_penalty: existing_item_waste_penalty
  expired_waste_unit_penalty: existing_item_waste_penalty
  arbitrary_big_m_cost_forbidden: true
  legacy_waste_field_semantics: alias_of_total_disposal

generator_protocol:
  protocol_id: phase6_controlled_synthetic_v1_0
  numeric_precision: IEEE_754_binary64
  rounding_before_output_forbidden: true
  tier_resolution_must_be_deterministic: true
  legacy_D0:
    source: configs/base.yaml
    canonical_lf_sha256: 943b8e414fbd3c04cc43e6bfe5f229623d869cd4c1be809b0b4d4ff30b81344a
    use_source_values_without_phase6_overrides: true
    reference_budget_convention: legacy_nominal_demand_baseline
    zero_truncation_expectation_correction_applied: false
    strict_distribution_theoretical_expectation_claim_forbidden: true
  applies_to_tiers:
    - V1
    - V2
    - P1
    - P2
  tier_resolution:
    item_selection: first_k_controlled_synthetic_baseline_item_archetypes
    period_count: scale_tier_periods
    training_scenario_count: scale_tier_training_scenarios
    item_order: controlled_synthetic_baseline_item_archetype_order
    period_index_origin: 0
    scenario_id_format: "s{zero_based_index:04d}"
  deterministic_baselines:
    first_item_base_demand_per_period: 100.0
    base_emergency_supply_ratio: 1.35
    initial_inventory:
      rule: zero_for_every_item_and_age
      value: 0.0
    storage_capacity:
      rule: capacity_t_equals_factor_times_sum_item_theoretical_mean_demand_t
      factor: 1.50
    demand_seasonality:
      applicable_period_counts: [6, 12, 24]
      raw_formula: 1_plus_sine_amplitude_times_sin_2pi_t_over_T_plus_cosine_amplitude_times_cos_4pi_t_over_T
      sine_amplitude: 0.20
      cosine_amplitude: 0.10
      normalization: divide_each_raw_value_by_arithmetic_mean_over_all_periods
    regular_price:
      base_first_item: 2.0
      formula: base_times_item_multiplier_times_1_plus_trend_slope_times_t_divided_by_T_minus_1_plus_sine_amplitude_times_sin_2pi_t_over_T
      trend_slope: 0.05
      trend_denominator: T_minus_1
      sine_amplitude: 0.025
  random_number_generation:
    engine: numpy_Generator_PCG64DXSM
    numpy_version: 2.5.1
    normal_distribution: standard_normal_location_0_scale_1
    normal_dtype: float64
    seed: seed_plan_selected_seed
    draw_order_per_scenario:
      - one_common_disaster_factor
      - one_item_factor_per_item_in_item_order
      - one_period_factor_per_period_in_period_order
      - demand_price_supply_idiosyncratic_normals_per_item_then_period
  latent_factor_model:
    independent_standard_normal_components: true
    demand_variance_loadings:
      common_disaster: 0.45
      item: 0.20
      period: 0.20
      idiosyncratic: 0.15
    demand_latent_formula: sum_square_root_variance_loading_times_corresponding_standard_normal
    price_latent_formula: demand_price_correlation_times_demand_latent_plus_sqrt_1_minus_correlation_squared_times_price_idiosyncratic
    supply_latent_formula: demand_supply_correlation_times_demand_latent_plus_sqrt_1_minus_correlation_squared_times_supply_idiosyncratic
  scenario_transformations:
    theoretical_mean_demand:
      formula: first_item_base_demand_times_item_demand_multiplier_times_normalized_seasonality_t
    demand:
      family: mean_corrected_lognormal
      log_sigma_formula: sqrt_log_1_plus_demand_cv_squared
      formula: theoretical_mean_times_exp_log_sigma_times_demand_latent_minus_half_log_sigma_squared
      truncation: none
    emergency_price_markup:
      family: lower_truncated_affine_normal
      formula: max_lower_bound_and_markup_mean_plus_markup_sd_times_price_latent
      lower_bound: 0.05
    emergency_price:
      formula: regular_price_times_1_plus_emergency_price_markup
    emergency_supply_factor:
      family: two_sided_clipped_affine_normal
      formula: clip_1_minus_supply_reduction_mean_plus_supply_shock_sd_times_supply_latent
      lower_bound: 0.05
      upper_bound: 1.50
    emergency_supply:
      formula: theoretical_mean_demand_times_base_emergency_supply_ratio_times_emergency_supply_factor
  penalty_protocol:
    maximum_reference_emergency_price:
      formula: maximum_regular_price_times_1_plus_markup_mean_plus_3_times_markup_sd
    shortage_penalty:
      formula: shortage_penalty_multiplier_times_item_maximum_reference_emergency_price
    waste_penalty:
      formula: waste_penalty_multiplier_times_item_maximum_regular_price

