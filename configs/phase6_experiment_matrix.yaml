out_of_sample_evaluation:
  tiers:
    - V2
  evidence_role: limited_descriptive_out_of_sample
  independent_training_seed_count_is_five: true
  strong_significance_claims_forbidden: true
  reporting_scope:
    - paired_effect_sizes
    - descriptive_uncertainty_intervals
    - feasibility_and_tail_risk_profiles
  not_a_substitute_for_V2_algorithm_timing_inference: true
  training_seed_count: 5
