candidate_protocol:
  candidate_ids: [minimum_endpoint, interval_midpoint, maximum_endpoint]
  reserves:
    minimum_endpoint: R_min_opt
    interval_midpoint: half_R_min_opt_plus_R_max_opt
    maximum_endpoint: R_max_opt
  every_candidate_fixes_reserve_and_reoptimizes_regular_procurement: true
  reuse_other_candidate_purchase_forbidden: true
  complete_extensive_model_required: true
  restricted_CCG_master_for_interval_forbidden: true
  every_candidate_training_objective_must_be_within_tolerance_optimal_face: true
  original_activation_thresholds:
    numerical_ratio_strictly_greater_than: 1.0e-4
    substantive_ratio_greater_than_or_equal_to: 0.01
    moderate_ratio_interval_inclusive: [0.05, 0.50]
  minimum_endpoint_identity_binding:
    also_serves_as_M2_control: true
    generated_and_finalized_once: true
    second_reoptimization_for_M2_control_forbidden: true
    required_equal_fields:
      - finalized_plan_artifact_sha256
      - regular_purchase_sha256
      - reserve_amount
      - exact_training_objective
      - training_joint_scenario_set_sha256
    if_selected_M2_1_and_M2_reference_same_artifact: true
    if_selected_test_difference_must_be_zero_within_frozen_tolerance: true

validation_selection:
  validation_data_only: true
  test_data_use_for_selection_forbidden: true
  criterion_order: [minimum_cvar95, minimum_mean_total_cost, minimum_reserve]
  cost_tie_tolerance:
    absolute: 1.0e-5
    relative: 1.0e-7
    formula: absolute_plus_relative_times_max_one_abs_best
  final_exact_tie_break_candidate_order: [minimum_endpoint, interval_midpoint, maximum_endpoint]
  service_level_role: secondary_report_only
  no_candidate_or_parameter_changes_after_validation: true
  common_random_numbers:
    generate_validation_scenario_set_once_per_seed_triplet: true
    all_three_candidates_reference_same_finalized_scenario_artifact: true
    required_equal_identity_fields:
      - scenario_set_sha256
      - scenario_order_sha256
      - latent_draw_sha256
      - demand_sha256
      - emergency_price_sha256
      - emergency_supply_sha256
      - fulfillment_sha256
    candidate_specific_random_draws_allowed: 0
    mismatch_status: validation_common_random_number_mismatch

