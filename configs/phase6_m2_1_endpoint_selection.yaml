statistical_protocol:
  independent_unit: formal_training_validation_test_seed_triplet
  independent_unit_count: 10
  primary_confirmatory_test_count: 1
  bootstrap:
    method: paired_cluster_percentile
    cluster_unit: seed_triplet
    random_seed: 2026090999
    resamples: 10000
    confidence_level: 0.95
    point_estimator: arithmetic_mean_of_ten_seed_triplet_paired_differences
    difference_direction: M2_1_minus_M2
  wilcoxon:
    test: paired_two_sided_signed_rank
    zero_method: pratt
    method: approx
    correction: false
    role: supportive
  multiple_testing_adjustment: not_applicable_one_primary_test
  no_new_confirmatory_hypothesis_after_test_access: true
  primary_support_rule: paired_mean_difference_below_zero_and_two_sided_95_percent_bootstrap_interval_upper_bound_below_zero
  wilcoxon_does_not_override_primary_support_rule: true
  secondary_metrics_do_not_select_or_gate_acceptance: true
  reject_if_validation_only_improvement_or_no_test_risk_improvement: true

