  pilot_completion_does_not_authorize_formal_execution: true

formal_comparison:
  strategies:
    - M2_minimum_endpoint
    - M2_1_validation_selected_endpoint
    - zero_autonomous_reserve
    - fixed_autonomous_reserve_0_10
    - fixed_autonomous_reserve_0_30
    - fixed_autonomous_reserve_0_50
  M2_control: complete_extensive_model_R_min_opt_endpoint
  M2_1_treatment: validation_selected_candidate
  fixed_strategies_reoptimize_regular_procurement: true
  same_new_test_scenarios_within_seed_triplet: true
  common_random_numbers:
    generate_test_scenario_set_once_per_seed_triplet: true
    all_six_strategies_reference_same_finalized_scenario_artifact: true
    required_equal_identity_fields:
