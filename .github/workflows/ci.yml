name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - feature/phase3-standard-ccg

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-gurobi-lock.txt
      - name: Syntax check
        run: python -m compileall -q src tests
      - name: Run unit and regression tests
        run: python -m pytest -q --ignore=tests/test_run_phase5.py
      - name: Run phase 5 end-to-end validation
        run: python -m pytest -q tests/test_run_phase5.py

  reproducibility-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements-gurobi-lock.txt
      - name: Verify Phase 6 checkout and reproducibility guards
        run: >-
          python -m pytest -q
          tests/test_phase6_reproducibility_hardening.py
